name: Install OpenTofu and Terramate
description: Install pinned OpenTofu and Terramate releases
runs:
  using: composite
  steps:
  - name: Fail on unsupported runner
    if: |-
      ${{ !((runner.os == 'macOS' && runner.arch == 'ARM64') ||
            (runner.os == 'Linux' && runner.arch == 'ARM64') ||
            (runner.os == 'Linux' && runner.arch == 'X64')) }}
    shell: bash
    run: |
      echo "Unsupported runner: os=${{ runner.os }} arch=${{ runner.arch }}"
      exit 1
  - name: Install OpenTofu (x64)
    if: runner.arch == 'X64' && runner.os == 'Linux'
    uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # v3.0.0
    with:
      repo: opentofu/opentofu
      tag: v1.13.2
      digest: ac05d9952662c7db28dd57e93f0a68018837bfdf9342384ec0987977c16a9645
  - name: Install OpenTofu (arm64)
    if: runner.arch == 'ARM64' && runner.os == 'Linux'
    uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # v3.0.0
    with:
      repo: opentofu/opentofu
      tag: v1.13.2
      digest: 88e2d9e3f94f97b76ab2faf55ade87578f56aed19c5e45fa139d70e994366d1f
  - name: Install OpenTofu (macOS)
    if: runner.os == 'macOS'
    uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # v3.0.0
    with:
      repo: opentofu/opentofu
      tag: v1.13.2
      digest: 0d1cdc85f38992055b48e7fb161304a2ddfe2e5ee0ff68ffec9d0349c8bd1b59
  - name: Install Terramate (x64)
    if: runner.arch == 'X64' && runner.os == 'Linux'
    uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # v3.0.0
    with:
      repo: terramate-io/terramate
      tag: v0.17.3
      digest: 303fd597a76af00c728b3eb626493dc2a71585dcd679c5e07a338da44d24a060
  - name: Install Terramate (arm64)
    if: runner.arch == 'ARM64' && runner.os == 'Linux'
    uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # v3.0.0
    with:
      repo: terramate-io/terramate
      tag: v0.17.3
      digest: b3956602a1eeeee9ea40add6682375d3f74c87d47b269103653b7b825b1dfd4a
  - name: Install Terramate (macOS)
    if: runner.os == 'macOS'
    uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # v3.0.0
    with:
      repo: terramate-io/terramate
      tag: v0.17.3
      digest: c3fe30c6060df4c8905c1ab8245852690058a83e63375fae984e564bfd87689a
